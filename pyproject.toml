[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunedu-oferta-academica"
version = "0.1.0"
description = "A quota-aware client for Peru's public SUNEDU/SIU data API and a polars pipeline that turns the microdata into a star model, with validations that fail loud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir Chavez" }]
dependencies = ["polars>=0.20", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
